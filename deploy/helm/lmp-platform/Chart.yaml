# The whole platform as one release. Each service is an alias of the same chart; cutover is off in the pilot.
apiVersion: v2
name: lmp-platform
description: Every loan-migration-platform service, pinned together.
type: application
version: 0.1.0
dependencies:
  - name: lmp-service
    alias: intake
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: sanitizer
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: docai
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: knowledge
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: agents
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: gate
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: ledger
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: broker
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: guard
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: runs
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: mapping
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: staging
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: verification
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: release
    version: 0.1.0
    repository: file://../lmp-service
  - name: lmp-service
    alias: cutover
    version: 0.1.0
    repository: file://../lmp-service
    condition: cutover.enabled
