# Defaults for one service. Each value is overridden per service in lmp-platform/values.yaml.
image: ""
zone: ""
replicas: 2
sandboxed: false # true runs the pod under gVisor with the Envoy sidecar as its only way out
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 512Mi }
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
automountServiceAccountToken: false
