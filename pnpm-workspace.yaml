# pnpm workspace and catalog: one version of every dependency, for every package.
# A package.json says `catalog:`, never a range, so two services can't drift apart.
#
# Versions checked against the npm registry on 2026-10-29. Each floor is the newest release that
# is at least a week old: minimumReleaseAge refuses anything younger, and pnpm picks newer
# releases as they age. Renovate raises the floors (renovate.json5).
packages:
  - "services/*"
  - "packages/*"
  - "tests"

# Supply chain: installs come from the bank's mirror, and only these packages may run install scripts.
catalogMode: strict
minimumReleaseAge: 10080 # minutes: a new release waits a week
trustPolicy: no-downgrade # refuse a release with weaker provenance than the one before it
# Releases older than a year skip that check: many predate provenance (chokidar 4.0.3, under
# @asyncapi/cli, is pnpm's own example). Anything newer that loses provenance still fails the install.
trustPolicyIgnoreAfter: 525600 # minutes
# Every install script is decided here; pnpm stops the install on any script nobody has reviewed.
allowBuilds:
  "@confluentinc/kafka-javascript": true # fetches librdkafka; the prebuilt binary is mirrored for the air gap
  "@bufbuild/buf": true # links the platform binary
  "@swc/core": true
  nx: true
  "@scarf/scarf": false # install-time analytics, pulled in by swagger-ui-dist and Pact
  cpu-features: false # optional native speed-up for ssh2; Testcontainers doesn't need it
  ssh2: false # the same: Docker is reached over its socket, not SSH
  protobufjs: false # its script only checks for optional CLI dependencies

