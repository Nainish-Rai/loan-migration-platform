# Strips macros and scripts, then masks identity numbers in text and in the image, before anything else reads a file.
[project]
name = "lmp-sanitizer"
version = "0.0.0"
description = "Strips macros and scripts, then masks identity numbers in text and in the image, before anything else reads a file."
requires-python = ">=3.12,<3.14"
dependencies = [
  "lmp-contracts",
  "temporalio>=1.35,<2",
  "pydantic>=2.14,<3",
  "pikepdf>=10.17,<11",
  "oletools>=0.60.2,<0.61",
  "magika>=1.0.3,<2",
  "presidio-analyzer>=2.2.366,<3",
  "presidio-anonymizer>=2.2.366,<3",
  "presidio-image-redactor>=0.0.62,<0.1",
  "pytesseract>=0.3.13,<0.4",
  "python-stdnum>=2.2,<3",
  "hvac>=2.4,<3",
  "boto3>=1.43,<2",
  "confluent-kafka>=2.16,<3",
  "opentelemetry-sdk>=1.45.1,<2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sanitizer"

[tool.uv.sources]
lmp-contracts = { workspace = true }

# The four rings, checked in CI by `lint-imports`. Imports point inward; the core imports no SDK.
[tool.importlinter]
root_packages = ["sanitizer"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Imports point inward"
type = "layers"
layers = ["sanitizer.main", "sanitizer.adapters", "sanitizer.application", "sanitizer.domain"]

[[tool.importlinter.contracts]]
name = "The core imports no SDK"
type = "forbidden"
source_modules = ["sanitizer.domain", "sanitizer.application"]
forbidden_modules = ["temporalio", "pikepdf", "oletools", "magika", "presidio_analyzer", "presidio_anonymizer", "presidio_image_redactor", "pytesseract", "hvac", "boto3", "confluent_kafka"]
