# Reads every tool result and prompt on the wire through Envoy's ext_proc: redacts identity numbers and flags injected instructions.
[project]
name = "lmp-guard"
version = "0.0.0"
description = "Reads every tool result and prompt on the wire through Envoy's ext_proc: redacts identity numbers and flags injected instructions."
requires-python = ">=3.12,<3.14"
dependencies = [
  "lmp-contracts",
  "grpcio>=1.85,<2",
  "protobuf>=7.36,<8",
  "presidio-analyzer>=2.2.366,<3",
  "presidio-anonymizer>=2.2.366,<3",
  "onnxruntime>=1.31.1,<2",
  "transformers>=5.22,<6",
  "pydantic>=2.14,<3",
  "opentelemetry-sdk>=1.45.1,<2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "guard"

[tool.uv.sources]
lmp-contracts = { workspace = true }

# The four rings, checked in CI by `lint-imports`. Imports point inward; the core imports no SDK.
[tool.importlinter]
root_packages = ["guard"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Imports point inward"
type = "layers"
layers = ["guard.main", "guard.adapters", "guard.application", "guard.domain"]

[[tool.importlinter.contracts]]
name = "The core imports no SDK"
type = "forbidden"
source_modules = ["guard.domain", "guard.application"]
forbidden_modules = ["grpc", "presidio_analyzer", "presidio_anonymizer", "onnxruntime", "transformers"]
